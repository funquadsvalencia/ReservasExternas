<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Su reserva en JetSkiValencia</title>
    <!-- Premium Global Google Typography Integration -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Google Material Icons Library (Loads instantly via Google Servers) -->
    <link href="https://googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #64ccf4; /* Match screen layout canvas backdrop header color from original screenshot */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px 24px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
        }

        .logo-container img {
            max-width: 115px;
            height: auto;
            object-fit: contain;
        }

        h1 {
            color: #0b2240;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #6b7c93;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 35px;
        }

        .section-label {
            text-align: left;
            color: #334d6e;
            font-size: 14px;
            font-weight: 500;
            margin: 24px 0 10px 4px;
        }

        .action-button {
            display: flex;
            align-items: center;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 20px;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }

        .action-button:hover {
            background-color: #f1f5f9;
            transform: translateY(-1px);
        }

        .icon-wrapper {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }

        /* Styling for the vector font icons */
        .material-icons {
            font-size: 28px;
            user-select: none;
        }

        /* Individual icon brand colors */
        .color-maps { color: #ea4335; }    /* Google Maps Red */
        .color-whatsapp { color: #25d366; }/* WhatsApp Green */
        .color-phone { color: #475569; }   /* Neutral Slate Dark for regular phone call */

        .btn-text {
            flex-grow: 1;
            text-align: left;
            color: #3b82f6; /* Native app shortcut interface link blue */
            font-size: 16px;
            font-weight: 500;
        }

        .btn-text.dark {
            color: #0f172a;
        }

        .arrow {
            color: #94a3b8;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Local Brand Asset Reference Using logo.png -->
        <div class="logo-container">
            <img src="logo.png" alt="JetSki Valencia Logo">
        </div>

        <h1>Su reserva en JetSkiValencia</h1>
        <p class="subtitle">Motos de agua / Katak / Paddle / Barco</p>

        <!-- Google Maps Location Redirect Element Button -->
        <a href="https://goo.gl" target="_blank" class="action-button">
            <div class="icon-wrapper">
                <span class="material-icons color-maps">place</span>
            </div>
            <div class="btn-text">Ubicación</div>
            <div class="arrow">→</div>
        </a>

        <div class="section-label">Encuéntreme en</div>

        <!-- WhatsApp Chat Portal Element Button -->
        <a href="https://wa.me" target="_blank" class="action-button">
            <div class="icon-wrapper">
                <span class="material-icons color-whatsapp">chat</span>
            </div>
            <div class="btn-text">WhatsApp</div>
            <div class="arrow">→</div>
        </a>

        <!-- Direct Voice Cell Action Call Routing Button -->
        <a href="tel:+34662694007" class="action-button">
            <div class="icon-wrapper">
                <span class="material-icons color-phone">phone</span>
            </div>
            <div class="btn-text dark">Llamar por teléfono</div>
            <div class="arrow">→</div>
        </a>
    </div>

</body>
</html>
