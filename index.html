<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Su reserva en JetSkiValencia</title>
    <!-- Tipografía limpia desde servidores de alta velocidad -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #64ccf4; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px 24px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
        }

        .logo-container img {
            max-width: 130px;
            height: auto;
            object-fit: contain;
        }

        h1 {
            color: #0b2240;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #6b7c93;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 35px;
        }

        .section-label {
            text-align: left;
            color: #334d6e;
            font-size: 14px;
            font-weight: 500;
            margin: 24px 0 10px 4px;
        }

        .action-button {
            display: flex;
            align-items: center;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 20px;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }

        .action-button:hover {
            background-color: #f1f5f9;
            transform: translateY(-1px);
        }

        .icon-wrapper {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }

        .icon-wrapper svg {
            width: 100%;
            height: 100%;
        }

        .btn-text {
            flex-grow: 1;
            text-align: left;
            color: #3b82f6; 
            font-size: 16px;
            font-weight: 500;
        }

        .btn-text.dark {
            color: #0f172a;
        }

        .arrow {
            color: #94a3b8;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Logotipo corporativo local -->
        <div class="logo-container">
            <img src="logo.png" alt="JetSki Valencia Logo">
        </div>

        <h1>Su reserva en JetSkiValencia</h1>
        <p class="subtitle">Motos de agua / Katak / Paddle / Barco</p>

        <!-- Botón de Ubicación de Google Maps -->
        <a href="https://goo.gl" target="_blank" class="action-button">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" xmlns="http://w3.org">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#ea4335"/>
                </svg>
            </div>
            <div class="btn-text">Ubicación</div>
            <div class="arrow">→</div>
        </a>

        <div class="section-label">Contáctanos por</div>

        <!-- ENLACE CORREGIDO: Abre el chat directo con tu número de teléfono (+34 662 69 40 07) -->
        <a href="https://wa.me" target="_blank" class="action-button">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" xmlns="http://w3.org">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.003 5.321 5.325 0 11.866 0c3.171.001 6.148 1.236 8.391 3.484 2.242 2.247 3.472 5.228 3.47 8.397-.003 6.541-5.325 11.862-11.866 11.862-2.002-.001-3.969-.512-5.713-1.488L0 24zm6.59-4.846c1.6.95 3.167 1.455 4.707 1.456 5.485 0 9.948-4.437 9.95-9.885.002-2.639-1.025-5.119-2.89-6.988C16.543 1.868 14.075 .841 11.46 .84 5.975.84 1.511 5.277 1.508 10.726c-.001 1.636.435 3.23 1.264 4.666l-.993 3.626 3.725-.972zm12.39-5.117c-.302-.151-1.787-.882-2.05-.978-.262-.096-.454-.144-.645.144-.191.288-.739.978-.907 1.17-.168.192-.336.216-.638.065-1.399-.7-2.31-1.153-3.21-2.696-.237-.406.237-.377.678-1.254.073-.15.037-.282-.018-.393-.056-.112-.454-1.093-.623-1.498-.164-.398-.333-.344-.454-.35-.116-.006-.25-.008-.383-.008-.134 0-.352.05-.536.25-.184.2-.704.688-.704 1.68 0 1 .725 1.96.826 2.096.101.136 1.428 2.182 3.46 3.061 1.52.657 2.095.698 2.846.586.46-.069 1.424-.582 1.624-1.144.2-.562.2-1.042.14-1.14-.06-.098-.223-.157-.525-.308z" fill="#25D366"/>
                </svg>
            </div>
            <div class="btn-text">WhatsApp</div>
            <div class="arrow">→</div>
        </a>

        <!-- Botón de Llamada Telefónica Directa -->
        <a href="tel:+34662694007" class="action-button">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" xmlns="http://w3.org">
                    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" fill="#475569"/>
                </svg>
            </div>
            <div class="btn-text dark">Llamar por teléfono</div>
            <div class="arrow">→</div>
        </a>
    </div>

</body>
</html>
