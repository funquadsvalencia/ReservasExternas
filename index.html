<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Su reserva en JetSkiValencia</title>
    <!-- Google Fonts for Clean, Premium Typography -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #64ccf4; /* Exact sky-blue branding background from your original dashboard screenshot */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px 24px;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
        }

        .logo-container img {
            max-width: 115px; /* Scaled perfectly to match the circular icon proportions */
            height: auto;
            border-radius: 50%; /* Keeps the custom brand border cleanly circular */
        }

        h1 {
            color: #0b2240;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #6b7c93;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 35px;
        }

        .section-label {
            text-align: left;
            color: #334d6e;
            font-size: 14px;
            font-weight: 500;
            margin: 24px 0 10px 4px;
        }

        .action-button {
            display: flex;
            align-items: center;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 20px;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }

        .action-button:hover {
            background-color: #f1f5f9;
            transform: translateY(-1px);
        }

        .icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }

        .icon img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .btn-text {
            flex-grow: 1;
            text-align: left;
            color: #3b82f6; /* Beautiful responsive template shortcut text blue color */
            font-size: 16px;
            font-weight: 500;
        }

        .btn-text.dark {
            color: #0f172a; /* Solid clean text color for direct dial action elements */
        }

        .arrow {
            color: #94a3b8;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Live JetSki Valencia Brand Logo Vector Asset -->
        <div class="logo-container">
            <img src="https://squarespace-cdn.com" alt="JetSki Valencia Logo">
        </div>

        <!-- Typography Context Matches -->
        <h1>Su reserva en JetSkiValencia</h1>
        <p class="subtitle">Motos de agua / Katak / Paddle / Barco</p>

        <!-- Google Maps Redirect Element Button -->
        <a href="https://goo.gl" target="_blank" class="action-button">
            <div class="icon">
                <img src="https://wikimedia.org" alt="Google Maps">
            </div>
            <div class="btn-text">Ubicación</div>
            <div class="arrow">→</div>
        </a>

        <div class="section-label">Encuéntreme en</div>

        <!-- WhatsApp Portal Connect Element Button -->
        <a href="https://wa.me" target="_blank" class="action-button">
            <div class="icon">
                <img src="https://wikimedia.org" alt="WhatsApp">
            </div>
            <div class="btn-text">WhatsApp</div>
            <div class="arrow">→</div>
        </a>

        <!-- Voice Call Integration Interface Routing Element Button -->
        <a href="tel:+34662694007" class="action-button">
            <div class="icon" style="opacity: 0.75;">
                <img src="https://flaticon.com" alt="Call Phone">
            </div>
            <div class="btn-text dark">Llamar por teléfono</div>
            <div class="arrow">→</div>
        </a>
    </div>

</body>
</html>
